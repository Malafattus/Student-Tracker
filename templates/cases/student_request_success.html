{% extends "base.html" %}
{% block title %}Request Submitted | UIS Student Record System{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h3 mb-2">Request received</h1>
                <p class="text-muted">Your request has been submitted to the counselling team. A follow-up email will be sent when possible.</p>
                <a class="btn btn-primary" href="{% url 'student_request_public' %}">Submit another request</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
