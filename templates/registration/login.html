<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Student Case Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-page">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3 text-center">Student Case Tracker</h1>
                        <p class="text-muted text-center">International counselling team workspace</p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label" for="id_username">Login ID</label>
                                <input class="form-control" type="text" name="username" id="id_username" required>
                                <div class="form-text">Use your username or email address.</div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="id_password">Password</label>
                                <input class="form-control" type="password" name="password" id="id_password" required>
                            </div>
                            {% if form.errors %}
                                <div class="alert alert-danger py-2">Invalid username or password. Please try again.</div>
                            {% endif %}
                            <button class="btn btn-primary w-100" type="submit">Sign in</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{% url 'student_request_public' %}">Student request form</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
